label{display:block;font-size:13px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;margin-top:4px}
input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
input[type=number]{width:78px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:600 14px "IBM Plex Sans",system-ui,sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btns{display:grid;gap:8px}
#msg{min-height:1.4em;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Fibonacci Voronoi plate<small>A round plate cut with one hole per Voronoi cell of a sunflower spiral.</small></h1>
<section class="view">
  <svg id="svg" viewBox="-90 -90 180 180" role="img" aria-label="Preview of the plate"></svg>
  <div class="st" id="stats"></div>
</section>
<section class="ctl" id="ctl">
  <div class="btns">
    <button id="bstl">Download STL</button>
    <button id="bled" class="alt">Download LED mask STL</button>
    <button id="bwire" class="alt">Download wiring guide STL</button>
    <button id="bdiff" class="alt">Download diffuser cells STL</button>
    <button id="b3mf" class="alt">Download 3MF of all parts (Snapmaker U1)</button>
    <button id="bsvg" class="alt">Download SVG outline</button>
    <button id="bsave" class="alt">Save settings to file</button>
    <button id="bload" class="alt">Load settings from file</button>
    <button id="breset" class="alt">Reset settings to defaults</button>
  </div>
  <div id="msg" role="status"></div>
</section>
</main>
<script>
const DEF={R:260,T:2,N:256,k:4.825,wall:.8,border:5.6,led:5,ledT:2,wireW:2,wireH:3,arms:13,wire:false,deboss:false,debW:1,debD:.6,diffH:2,diffClr:.1,maskClr:1,borderH:2,podD:10,podH:2,split:false,fit:true,start:225};
const SPEC=[["R","Plate radius (mm)",40,600,1],["T","Wall height (mm)",.4,100,.1],["borderH","Border height (mm)",.4,100,.1],["diffH","Diffuser height (mm)",.2,100,.1],["diffClr","Diffuser clearance (mm, negative = overlap)",-2,1,.01],["maskClr","LED mask size clearance (mm, shrinks outer edge)",-5,10,.1],["podD","LED module pocket diameter (mm, 0 = none)",0,30,.5],["podH","LED module pocket depth (mm)",.2,10,.1],["N","Number of cells",20,800,1],["wall","Wall between holes (mm)",.3,15,.05],["border","Border width (mm)",1,150,.1],["led","LED mask hole diameter (mm)",.5,40,.1],["ledT","LED mask thickness (mm)",.4,10,.1],["debW","Debossed line width (mm)",.3,5,.1],["debD","Debossed line depth (mm)",.1,5,.1],["wireW","Wiring guide rib width (mm)",.6,10,.1],["wireH","Wiring guide rib height (mm)",.5,15,.1]];
const P={...DEF}, GA=180*(3-Math.sqrt(5));
const $=id=>document.getElementById(id);
const ctl=$("ctl"), btns=ctl.querySelector(".btns");
const inputs={};
SPEC.forEach(([key,name,min,max,step])=>{
  const d=document.createElement("div");
  d.innerHTML=`<label for="r_${key}">${name}</label><div class="row"><input type="range" id="r_${key}" min="${min}" max="${max}" step="${step}"><input type="number" id="n_${key}" min="${min}" max="${max}" step="${step}"></div>`;
  ctl.insertBefore(d,btns);
  const r=d.querySelector("[type=range]"), n=d.querySelector("[type=number]");
  inputs[key]=[r,n];
  const set=e=>{const v=parseFloat(e.target.value);if(!isNaN(v)){P[key]=v;r.value=v;if(e.target===r)n.value=v;schedule();}};
  r.addEventListener("input",set); n.addEventListener("change",set);
});
const effK=()=>0.9542*(P.R-P.border+P.wall/2)/Math.sqrt(P.N-.5);
const wireBox=document.createElement("div");
wireBox.innerHTML='<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="wire"> Show wiring guide in preview</label><label for="arms" style="margin-top:8px">Wiring segments (one per spiral arm)</label><select id="arms" style="margin-top:4px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit">'+[5,8,13,21,34].map(v=>`<option value="${v}">${v}</option>`).join("")+'</select>';
ctl.insertBefore(wireBox,btns);
const wireCb=wireBox.querySelector("#wire"),armSel=wireBox.querySelector("#arms");
wireCb.addEventListener("change",()=>{P.wire=wireCb.checked;schedule();});
armSel.addEventListener("change",()=>{P.arms=+armSel.value;schedule();});
function sync(){
  if(P.border>P.R-5)P.border=P.R-5;
  for(const k in inputs){inputs[k][0].value=P[k];inputs[k][1].value=P[k];}
  wireCb.checked=P.wire;armSel.value=P.arms;splitCb.checked=!!P.split;debCb.checked=!!P.deboss;updSplit();
}

function clipHalf(poly,p,nx,ny,lim){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const da=(a[0]-p[0])*nx+(a[1]-p[1])*ny-lim, db=(b[0]-p[0])*nx+(b[1]-p[1])*ny-lim;
    if(da<=0)out.push(a);
    if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
  }
  return out;
}
function build(){
  const k=effK();const S=[];for(let i=0;i<P.N;i++){const r=k*Math.sqrt(i+.5),a=(P.start-i*GA)*Math.PI/180;S.push([r*Math.cos(a),r*Math.sin(a)]);}
  const rc=Math.max(1,P.R-P.border), holes=[];ids=[];
  for(let i=0;i<S.length;i++){
    const p=S[i];
    let poly=[];for(let s=0;s<128;s++){const a=s/128*2*Math.PI;poly.push([rc*Math.cos(a),rc*Math.sin(a)]);}
    const others=[];for(let j=0;j<S.length;j++)if(j!==i)others.push([Math.hypot(S[j][0]-p[0],S[j][1]-p[1]),j]);
    others.sort((a,b)=>a[0]-b[0]);
    for(const [d,j] of others){
      let m=0;for(const v of poly)m=Math.max(m,Math.hypot(v[0]-p[0],v[1]-p[1]));
      if(d/2-P.wall/2>m)break;
      poly=clipHalf(poly,p,(S[j][0]-p[0])/d,(S[j][1]-p[1])/d,d/2-P.wall/2);
      if(poly.length<3)break;
    }
    if(poly.length>=3){holes.push(poly);ids.push(i);}
  }
  return holes;
}
const area=pl=>{let s=0;for(let i=0;i<pl.length;i++){const a=pl[i],b=pl[(i+1)%pl.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;};
let holes=[];
let ids=[];
function ledHoles(){return holes.map(h=>{let A=0,cx=0,cy=0;for(let i=0;i<h.length;i++){const a=h[i],b=h[(i+1)%h.length],c=a[0]*b[1]-b[0]*a[1];A+=c;cx+=(a[0]+b[0])*c;cy+=(a[1]+b[1])*c;}A*=.5;cx/=6*A;cy/=6*A;let m=1e9;for(let i=0;i<h.length;i++){const a=h[i],b=h[(i+1)%h.length],ex=b[0]-a[0],ey=b[1]-a[1],t=Math.max(0,Math.min(1,((cx-a[0])*ex+(cy-a[1])*ey)/(ex*ex+ey*ey||1))),dx=cx-(a[0]+t*ex),dy=cy-(a[1]+t*ey);m=Math.min(m,Math.hypot(dx,dy));}return{x:cx,y:cy,m,r:Math.min(P.led/2,m*.95)};});}
function wireLines(){
  const L=ledHoles(),pos=new Map();ids.forEach((id,k)=>pos.set(id,L[k]));
  const M=P.arms,ph=r=>(((-r*GA)%360)+360)%360,cls=[];
  for(let r=0;r<M;r++)cls.push(r);
  cls.sort((a,b)=>ph(a)-ph(b));
  const segs=[],out=[];
  cls.forEach(r=>{const arm=[];for(let n=r;n<P.N;n+=M)if(pos.has(n))arm.push(pos.get(n));segs.push(arm);});
  for(const s of segs)for(let i=0;i+1<s.length;i++){
    const a=s[i],b=s[i+1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d-a.r-b.r<.5)continue;
    const ux=dx/d,uy=dy/d;
    out.push({a:[a.x+ux*a.r,a.y+uy*a.r],b:[b.x-ux*b.r,b.y-uy*b.r]});
  }
  out.counts=segs.map(s=>s.length);
  out.ends=segs.filter(s=>s.length).map(s=>[s[0],s[s.length-1]]);
  return out;
}
function wireDots(){return wireLines().ends.map(e=>[[e[0],"#2fbf71"],[e[1],"#e5484d"]].map(([c,f])=>`<circle cx="${c.x.toFixed(2)}" cy="${(-c.y).toFixed(2)}" r="${Math.max(2.5,P.R/70).toFixed(2)}" fill="${f}" stroke="#fff" stroke-width=".6"/>`).join("")).join("");}
function wireInfo(){const c=wireLines().counts,mn=Math.min(...c),mx=Math.max(...c),e=Math.round(P.N/P.arms)*P.arms;return `. Wiring: ${c.length} separate segments of ${mn===mx?mn:mn+"\u2013"+mx} LEDs (green = start, red = end)`+(mn===mx?"":` (set cells to ${e} for equal segments)`);}
function triBuf(tris){
  const buf=new ArrayBuffer(84+50*tris.length),dv=new DataView(buf);dv.setUint32(80,tris.length,true);
  tris.forEach((t,i)=>{const o=84+50*i,u=[0,1,2].map(k=>t[1][k]-t[0][k]),v=[0,1,2].map(k=>t[2][k]-t[0][k]);const nm=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],l=Math.hypot(...nm)||1;[...nm.map(x=>x/l),...t[0],...t[1],...t[2]].forEach((x,k)=>dv.setFloat32(o+4*k,x,true));});
  return new Uint8Array(buf);
}
function wireStl(){
  const z0=P.ledT,z1=P.ledT+P.wireH,tris=[],q=(a,b,c)=>tris.push([a,b,c]),T=(p,z)=>[p[0],p[1],z];
  wireLines().forEach(d=>{
    const dx=d.b[0]-d.a[0],dy=d.b[1]-d.a[1],l=Math.hypot(dx,dy),nx=-dy/l*P.wireW/2,ny=dx/l*P.wireW/2;
    const C=[[d.a[0]-nx,d.a[1]-ny],[d.b[0]-nx,d.b[1]-ny],[d.b[0]+nx,d.b[1]+ny],[d.a[0]+nx,d.a[1]+ny]];
    q(T(C[0],z1),T(C[1],z1),T(C[2],z1));q(T(C[0],z1),T(C[2],z1),T(C[3],z1));
    q(T(C[0],z0),T(C[2],z0),T(C[1],z0));q(T(C[0],z0),T(C[3],z0),T(C[2],z0));
    for(let i=0;i<4;i++){const a=C[i],b=C[(i+1)%4];q(T(a,z0),T(b,z0),T(b,z1));q(T(a,z0),T(b,z1),T(a,z1));}
  });
  return triBuf(tris);
}
const maskR=()=>Math.max(1,P.R-P.maskClr);
function seedList(){const k=effK(),S=[];for(let i=0;i<P.N;i++){const r=k*Math.sqrt(i+.5),a=(P.start-i*GA)*Math.PI/180;S.push([r*Math.cos(a),r*Math.sin(a)]);}return S;}
const quadOf=p=>Math.floor((((Math.atan2(p[1],p[0])*180/Math.PI)%360)+360)%360/90);
function clipTag(poly,p,nx,ny,lim,tag){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const da=(a[0]-p[0])*nx+(a[1]-p[1])*ny-lim,db=(b[0]-p[0])*nx+(b[1]-p[1])*ny-lim;
    if(da<=0)out.push(a);
    if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,da<0?tag:a[2]]);}
  }
  return out;
}
function territory(i,S,Ro){
  const p=S[i],NO=180,RR=Ro||P.R;let poly=[];
  for(let s=0;s<NO;s++){const a=s/NO*2*Math.PI;poly.push([RR*Math.cos(a),RR*Math.sin(a),-1]);}
  const others=[];for(let j=0;j<S.length;j++)if(j!==i)others.push([Math.hypot(S[j][0]-p[0],S[j][1]-p[1]),j]);
  others.sort((a,b)=>a[0]-b[0]);
  for(const [d,j] of others){
    let m=0;for(const v of poly)m=Math.max(m,Math.hypot(v[0]-p[0],v[1]-p[1]));
    if(d/2>m)break;
    poly=clipTag(poly,p,(S[j][0]-p[0])/d,(S[j][1]-p[1])/d,d/2,j);
    if(poly.length<3)break;
  }
  return poly;
}
function cutLines(){
  const S=seedList(),Qd=S.map(quadOf);let d="";
  for(let i=0;i<S.length;i++){const poly=territory(i,S);
    poly.forEach((v,k)=>{const w=poly[(k+1)%poly.length];if(v[2]>i&&Qd[v[2]]!==Qd[i])d+=`M${v[0].toFixed(2)} ${(-v[1]).toFixed(2)}L${w[0].toFixed(2)} ${(-w[1]).toFixed(2)}`;});}
  return `<path d="${d}" fill="none" stroke="#d946ef" stroke-width="${Math.max(.8,P.R/150).toFixed(2)}"/>`;
}
function quarterStl(q,mask){
  const S=seedList(),H=mask?P.ledT:P.T,tris=[],hmap=new Map(),Qd=S.map(quadOf);
  if(mask){const L=ledHoles();ids.forEach((id,k)=>{const c=L[k],pg=[];for(let i=0;i<40;i++){const a=i/40*2*Math.PI;pg.push([c.x+c.r*Math.cos(a),c.y+c.r*Math.sin(a)]);}hmap.set(id,pg);});}
  else ids.forEach((id,k)=>hmap.set(id,holes[k]));
  const wall=(a,b)=>{tris.push([[a[0],a[1],0],[b[0],b[1],0],[b[0],b[1],H]],[[a[0],a[1],0],[b[0],b[1],H],[a[0],a[1],H]]);};
  for(let i=0;i<S.length;i++){
    if(Qd[i]!==q)continue;
    const poly=territory(i,S,mask?maskR():undefined),h=hmap.get(i),rings=[poly.map(v=>[v[0],v[1]])];
    if(h)rings.push(area(h)>0?h.slice().reverse():h);
    const flat=[],hi=[];let n=0;
    rings.forEach((r,k)=>{if(k)hi.push(n);r.forEach(v=>{flat.push(v[0],v[1]);n++;});});
    const idx=earcut(flat,hi),V=j=>[flat[2*j],flat[2*j+1]];
    for(let t=0;t<idx.length;t+=3){
      let a=V(idx[t]),b=V(idx[t+1]),c=V(idx[t+2]);
      if(area([a,b,c])<0)[b,c]=[c,b];
      tris.push([[...a,H],[...b,H],[...c,H]],[[...a,0],[...c,0],[...b,0]]);
    }
    poly.forEach((v,k)=>{const w=poly[(k+1)%poly.length];if(v[2]===-1||(v[2]>=0&&Qd[v[2]]!==q))wall(v,w);});
    if(h){const r=rings[1];for(let k=0;k<r.length;k++)wall(r[k],r[(k+1)%r.length]);}
  }
  return triBuf(tris);
}
function growConvex(poly,d){const n=poly.length,out=[];
  for(let i=0;i<n;i++){const a=poly[(i+n-1)%n],b=poly[i],c=poly[(i+1)%n];
    const e0=[b[0]-a[0],b[1]-a[1]],e1=[c[0]-b[0],c[1]-b[1]],l0=Math.hypot(e0[0],e0[1])||1,l1=Math.hypot(e1[0],e1[1])||1;
    const n0=[e0[1]/l0,-e0[0]/l0],n1=[e1[1]/l1,-e1[0]/l1],k=1+n0[0]*n1[0]+n0[1]*n1[1];
    out.push([b[0]+d*(n0[0]+n1[0])/k,b[1]+d*(n0[1]+n1[1])/k]);}
  return out;}
function diffuserStl(q){
  const SL=q===undefined?null:seedList(),H=P.diffH,c=P.diffClr,tris=[],T=(p,z)=>[p[0],p[1],z];
  holes.forEach((h0,hk)=>{
    if(SL&&quadOf(SL[ids[hk]])!==q)return;
    const h=area(h0)<0?h0.slice().reverse():h0;let poly=h.map(v=>[v[0],v[1]]);
    if(c>0)for(let i=0;i<h.length;i++){const a=h[i],b=h[(i+1)%h.length],ex=b[0]-a[0],ey=b[1]-a[1],l=Math.hypot(ex,ey)||1;poly=clipHalf(poly,a,ey/l,-ex/l,-c);if(poly.length<3)return;}
    if(c<0)poly=growConvex(poly,-c);
    const n=poly.length;
    for(let i=1;i+1<n;i++)tris.push([T(poly[0],H),T(poly[i],H),T(poly[i+1],H)],[T(poly[0],0),T(poly[i+1],0),T(poly[i],0)]);
    for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];tris.push([T(a,0),T(b,0),T(b,H)],[T(a,0),T(b,H),T(a,H)]);}
  });
  return triBuf(tris);
}
function maskDeboss(q){
  const pc=polygonClipping,S=seedList(),Qd=S.map(quadOf),L=ledHoles();
  let dom;
  if(q===undefined){const pg=[];for(let s=0;s<180;s++){const a=s/180*2*Math.PI;pg.push([maskR()*Math.cos(a),maskR()*Math.sin(a)]);}dom=[[pg]];}
  else{const polys=[];for(let i=0;i<S.length;i++)if(Qd[i]===q)polys.push([territory(i,S,maskR()).map(v=>[Math.round(v[0]*1e4)/1e4,Math.round(v[1]*1e4)/1e4])]);if(!polys.length)return triBuf([]);dom=pc.union(...polys);}
  const circ=[];
  L.forEach((c,k)=>{if(q!==undefined&&Qd[ids[k]]!==q)return;const pg=[];for(let i=0;i<40;i++){const a=i/40*2*Math.PI;pg.push([c.x+c.r*Math.cos(a),c.y+c.r*Math.sin(a)]);}circ.push([pg]);});
  const T=P.ledT,cap=T-.2,d=P.deboss?Math.min(P.debD,cap):0,pd=P.podD>0?Math.min(P.podH,cap):0,tris=[];
  const rects=[],hw=P.debW/2,pods=[];
  if(P.deboss)wireLines().forEach(d=>{const dx=d.b[0]-d.a[0],dy=d.b[1]-d.a[1],l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,nx=-uy*hw,ny=ux*hw,e=.5;
    const a=[d.a[0]-ux*e,d.a[1]-uy*e],b=[d.b[0]+ux*e,d.b[1]+uy*e];
    rects.push([[[a[0]-nx,a[1]-ny],[b[0]-nx,b[1]-ny],[b[0]+nx,b[1]+ny],[a[0]+nx,a[1]+ny]]]);});
  if(P.podD>0)L.forEach((c,k)=>{if(q!==undefined&&Qd[ids[k]]!==q)return;const r=Math.min(P.podD/2,c.m*.97),pg=[];for(let i=0;i<48;i++){const a=i/48*2*Math.PI;pg.push([c.x+r*Math.cos(a),c.y+r*Math.sin(a)]);}pods.push([pg]);});
  const extrude=(mp,z0,z1)=>mp.forEach(poly=>{
    const rings=poly.map((r,k)=>{let pg=r.slice();if(pg.length>1&&pg[0][0]===pg[pg.length-1][0]&&pg[0][1]===pg[pg.length-1][1])pg.pop();const a=area(pg);if((k===0&&a<0)||(k>0&&a>0))pg.reverse();return pg;});
    const flat=[],hi=[];let n=0;rings.forEach((r,k)=>{if(k)hi.push(n);r.forEach(v=>{flat.push(v[0],v[1]);n++;});});
    const idx=earcut(flat,hi),V=j=>[flat[2*j],flat[2*j+1]];
    for(let t=0;t<idx.length;t+=3){let a=V(idx[t]),b=V(idx[t+1]),c=V(idx[t+2]);if(area([a,b,c])<0)[b,c]=[c,b];
      tris.push([[...a,z1],[...b,z1],[...c,z1]],[[...a,z0],[...c,z0],[...b,z0]]);}
    rings.forEach(r=>{for(let k=0;k<r.length;k++){const a=r[k],b=r[(k+1)%r.length];tris.push([[a[0],a[1],z0],[b[0],b[1],z0],[b[0],b[1],z1]],[[a[0],a[1],z0],[b[0],b[1],z1],[a[0],a[1],z1]]);}});
  });
  const bs=[...new Set([0,d,pd,T])].sort((x,y)=>x-y);
  for(let i=0;i+1<bs.length;i++){const z0=bs[i],z1=bs[i+1],cuts=[...circ];
    if(z1<=d+1e-9)cuts.push(...rects);if(z1<=pd+1e-9)cuts.push(...pods);
    extrude(cuts.length?pc.difference(dom,pc.union(...cuts)):dom,z0,z1);}
  return triBuf(tris);
}
function maskOut(q){return (P.deboss||P.podD>0)?maskDeboss(q):(q===undefined?maskStl():quarterStl(q,true));}
function extrudeMP(mp,z0,z1,tris){
  mp.forEach(poly=>{

$("b3mf").onclick=async()=>{
  if(typeof earcut==="undefined"){msg("The triangulation library didn't load, so 3MF export is unavailable.");return;}
  msg("Building 3MF...");await new Promise(r=>setTimeout(r,30));
  const r=await build3mf();
  await save(dl?"voronoi_fibonacci_3mf.zip":"voronoi_fibonacci.3mf",r.blob);
  const t=$("msg").textContent+(dl?" Rename the .zip to .3mf.":"")+(r.warn.length?" Too big for the 270 mm bed: "+r.warn.join("; ")+". Turn on the quarter split.":"");
  msg(t);
};
$("bsvg").onclick=()=>save("voronoi_fibonacci.svg",svgText());
$("bwire").onclick=()=>{const u=wireStl();if(dl)save("wiring_guide_stl.zip",new Blob([zip("wiring_guide.stl",u)],{type:"application/zip"}));else save("wiring_guide.stl",new Blob([u],{type:"model/stl"}));};
$("bled").onclick=()=>{if(typeof earcut==="undefined"){msg("The triangulation library didn't load, so STL export is unavailable.");return;}if(P.split){save("led_mask_quarters.zip",zipMulti([0,1,2,3].map(q=>["led_mask_quarter_"+(q+1)+".stl",maskOut(q)])));return;}const u=maskOut();if(dl)save("led_mask_stl.zip",new Blob([zip("led_mask.stl",u)],{type:"application/zip"}));else save("led_mask.stl",new Blob([u],{type:"model/stl"}));};
$("breset").onclick=()=>{Object.assign(P,DEF);clearLocal();sync();render();msg("Settings reset to defaults.");};
(async()=>{try{dl=await claude.use("downloads");}catch(e){dl=null;}
  })();
const splitBox=document.createElement("div");
splitBox.innerHTML='<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="split"> Split into 4 quarters for printing</label>';
ctl.insertBefore(splitBox,btns);
const splitCb=splitBox.querySelector("input");
const debBox=document.createElement("div");
debBox.innerHTML='<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="deboss"> Deboss wiring lines on LED mask</label>';
ctl.insertBefore(debBox,btns);
const debCb=debBox.querySelector("input");
debCb.addEventListener("change",()=>{P.deboss=debCb.checked;schedule();});
function updSplit(){$("bstl").textContent=P.split?"Download STL (zip of 4 quarters)":"Download STL";$("bdiff").textContent=P.split?"Download diffuser cells (zip of 4 quarters)":"Download diffuser cells STL";$("bled").textContent=P.split?"Download LED mask (zip of 4 quarters)":"Download LED mask STL";}
splitCb.addEventListener("change",()=>{P.split=splitCb.checked;updSplit();schedule();});
function applyConfig(txt){
  let o;try{o=JSON.parse(txt);}catch(e){msg("That file isn't valid settings JSON.");return;}
  o=o&&o.settings?o.settings:o;let n=0;
  for(const k in DEF)if(o&&typeof o[k]===typeof DEF[k]&&(typeof o[k]!=="number"||isFinite(o[k]))){P[k]=o[k];n++;}
  if(!n){msg("No recognised settings found in that file.");return;}
  sync();schedule();msg("Loaded "+n+" settings.");
}
const cfgIn=document.createElement("input");cfgIn.type="file";cfgIn.accept=".json,application/json";cfgIn.style.display="none";document.body.appendChild(cfgIn);
cfgIn.addEventListener("change",()=>{const f=cfgIn.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyConfig(String(r.result));r.readAsText(f);cfgIn.value="";});
$("bsave").onclick=()=>save("voronoi_fibonacci_settings.json",JSON.stringify({app:"voronoi-fibonacci",version:1,settings:P},null,2));
$("bload").onclick=()=>cfgIn.click();
loadLocal();sync();render();
</script>
